      responses:
        "200":
          $ref: "#/components/responses/UpdatedShipment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/shipments/{shipment_id}/pickup-code:
    parameters:
      - $ref: "#/components/parameters/ShipmentID"
    post:
      operationId: issuePickupCode
      tags: [Shipments]
      summary: Issue a pickup code
      description: |
        `ADMIN` and `WAREHOUSE_MANAGER` of the owner, while the shipment is `CREATED` and has a driver; otherwise
        `409 INVALID_STATE_TRANSITION`. The 6-digit code is valid for 15 minutes and 5 attempts and replaces any code
        issued before. It is returned only here and stored only as an HMAC: hand it to the driver at the dock.
        Assigning another driver or carrier, or cancelling, ends it.
      responses:
        "201":
          description: The code. The response must not be cached.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickupCode"
              example:
                code: "042917"
                expires_at: "2026-10-02T08:15:00.123456Z"
                attempts_allowed: 5
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/shipments/{shipment_id}/pickup:
    parameters:
      - $ref: "#/components/parameters/ShipmentID"
    post:
      operationId: confirmPickup
      tags: [Shipments]
      summary: Confirm pickup
      description: |
        The assigned `DRIVER` takes custody at the origin. The checks run in this order: the shipment is not
        recalled (`409 SHIPMENT_RECALLED_LOCKED`) and is `CREATED` (`409 INVALID_STATE_TRANSITION`); the caller is
        its assigned driver (403); the scanned SSCC is the shipment's (`422 SSCC_MISMATCH`); a code is active
        (`422 PICKUP_CODE_EXPIRED`) and has attempts left (`423 PICKUP_CODE_LOCKED`); the code is right
        (`422 PICKUP_CODE_INVALID` with `remaining_attempts`, and the attempt is spent); the position is inside the
        origin geo-fence (`422 OUTSIDE_GEOFENCE` with `distance_meters` and `allowed_meters`). On success the code
        is consumed, the shipment is `IN_TRANSIT`, and `shipment.pickup_confirmed` records the position.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PickupConfirmation"
            example:
              sscc: "089300010000000018"
              code: "042917"
              position:
                latitude: 10.762701
                longitude: 106.742912
                accuracy_meters: 12
      responses:
        "200":
          $ref: "#/components/responses/UpdatedShipment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "423":
          $ref: "#/components/responses/Locked"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/shipments/{shipment_id}/checkpoints:
    parameters:
      - $ref: "#/components/parameters/ShipmentID"
    post:
      operationId: recordCheckpoint
      tags: [Shipments]
      summary: Record a checkpoint
      description: |
        The assigned `DRIVER`, while the shipment is `IN_TRANSIT`, at an intermediate facility named by its GLN: an
        active location of any tenant, or `400` with `INVALID_VALUE` on `gln`. The scanned SSCC must be the
        shipment's (`422 SSCC_MISMATCH`) and the position inside the facility's geo-fence
        (`422 OUTSIDE_GEOFENCE`). The status stays `IN_TRANSIT`; `shipment.checkpoint_recorded` records the facility
        and the position.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckpointRecord"
      responses:
        "200":
          $ref: "#/components/responses/UpdatedShipment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/shipments/{shipment_id}/delivery:
    parameters:
      - $ref: "#/components/parameters/ShipmentID"
    post:
      operationId: confirmDelivery
      tags: [Shipments]
      summary: Confirm delivery
      description: |
        `ADMIN` and `WAREHOUSE_MANAGER` of the consignee, while the shipment is `IN_TRANSIT`. The scanned SSCC must
        be the shipment's (`422 SSCC_MISMATCH`) and the position inside the destination geo-fence
        (`422 OUTSIDE_GEOFENCE`). The shipment is `DELIVERED`, the quantity lands on the consignee's balance at the
        destination, which makes the consignee a holder of the lot, and `shipment.delivery_confirmed` records the
        position.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryConfirmation"
      responses:
        "200":
          $ref: "#/components/responses/UpdatedShipment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/shipments/{shipment_id}/events:
    parameters:
      - $ref: "#/components/parameters/ShipmentID"
    get:
      operationId: listShipmentEvents
      tags: [Shipments]
      summary: Read the event log
      description: |
        Oldest first, with the hashes that chain the events (ADR-0006). Each item carries every member that its hash
        covers, so a client can recompute the chain itself (see `docs/contracts/messaging.md` §2.1).
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of events.
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShipmentEventPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/shipments/{shipment_id}/integrity:
    parameters:
      - $ref: "#/components/parameters/ShipmentID"
    get:
      operationId: verifyShipmentIntegrity
      tags: [Shipments]
      summary: Verify the event log
      description: |
        Recomputes the hash chain: every event must have the next sequence number, link to the hash of the event
        before it, and hash to its stored hash. A rewritten, removed, or reordered event breaks the chain at
        `first_invalid_sequence`.
      responses:
        "200":
          description: The result.
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Integrity"
              example:
                valid: true
                event_count: 3
                head_hash: b950012d685ecf3e7f7ccf416581645cd8a0e61070e08d7c11fc1448d9212435
                first_invalid_sequence: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/directory/locations/{gln}:
    parameters:
      - name: gln
        in: path
        required: true
        schema:
          type: string
          pattern: "^[0-9]{13}$"
    get:
      operationId: lookUpLocation
      tags: [Directory]
      summary: Look up a GLN
      description: |
        Any signed-in user. Resolves the GLN of an active location of an active tenant, own or other, to its
        public fields and its tenant. A GLN with a wrong length, a non-digit, or a wrong check digit answers
        `422 INVALID_GS1_IDENTIFIER`; a valid GLN without an active location answers 404.
      responses:
        "200":
          description: The location's directory entry.
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectoryLocation"
              example:
                gln: "8930001000025"
                name: Tan Thuan cold store
                address: 5 Tan Thuan Export Processing Zone, District 7
                city: Ho Chi Minh City
                country_code: VN
                latitude: 10.762622
                longitude: 106.742801
                geo_fence_radius_meters: 300
                tenant:
                  id: 0192f7a4-7c3e-7d2a-9b1e-3f4a5b6c7d8e
                  code: SGFRESH
                  legal_name: Saigon Fresh Foods Joint Stock Company
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/directory/tenants/{code}:
    parameters:
      - name: code
        in: path
        required: true
        description: Tenant code; matched ignoring case.
        schema:
          type: string
    get:
      operationId: lookUpTenant
      tags: [Directory]
      summary: Look up a tenant code
      description: Any signed-in user. Resolves the code of an active tenant, for example to pick a carrier.
      responses:
        "200":
          description: The tenant's directory entry.
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectoryTenant"
              example:
                id: 0192f7a4-7c3e-7d2a-9b1e-3f4a5b6c7d93
                code: MEKONG_LOGISTICS
                legal_name: Mekong Logistics Company Limited
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: EdDSA-signed access token issued by `POST /api/v1/auth/login`.
  parameters:
    Limit:
      name: limit
      in: query
      description: Maximum number of items to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's `next_cursor`.
      schema:
        type: string
    ShipmentID:
      name: shipment_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  headers:
    TraceId:
      description: Trace ID of the request, for support and log correlation.
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem document with VeriTrace extensions.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
          example: about:blank
        title:
          type: string
          example: Unprocessable Content
        status:
          type: integer
          example: 422
        code:
          type: string
          description: Stable machine-readable error code.
          example: INVALID_GS1_IDENTIFIER
        detail:
          type: string
        instance:
          type: string
          example: /api/v1/products
        trace_id:
          type: string
          pattern: "^[0-9a-f]{32}$"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
        remaining_attempts:
          type: integer
          description: "`PICKUP_CODE_INVALID`: attempts left on the code."
        distance_meters:
          type: number
          description: "`OUTSIDE_GEOFENCE`: distance between the reported position and the facility."
        allowed_meters:
          type: number
          description: "`OUTSIDE_GEOFENCE`: the geo-fence radius plus the accuracy allowance (at most 50 m)."
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          example: gtin
        code:
          type: string
          example: CHECK_DIGIT
        message:
          type: string
    Tenant:
      type: object
      description: A company registered on VeriTrace.
      required: [id, code, legal_name, tax_code, gs1_company_prefix, sscc_extension_digit, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          description: Short unique code, used by other tenants to select a carrier or inspector.
          pattern: "^[A-Z0-9_]{3,32}$"
        legal_name:
          type: string
          minLength: 1
          maxLength: 255
        tax_code:
          type: string
          pattern: "^[0-9]{10}(-[0-9]{3})?$"
        gs1_company_prefix:
          type: string
          description: GS1 company prefix (GCP). Every GLN and GTIN of the tenant starts with it.
          pattern: "^[0-9]{6,10}$"
        sscc_extension_digit:
          type: integer
          description: First digit of the SSCCs the tenant issues.
          minimum: 0
          maximum: 9
        status:
          type: string
          description: Users of a `SUSPENDED` tenant cannot sign in.
          enum: [ACTIVE, SUSPENDED]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Location:
      type: object
      description: A warehouse, hub, or headquarters of the caller's tenant, identified by its GLN.
      required: [id, gln, name, address, city, country_code, latitude, longitude, geo_fence_radius_meters, is_headquarters, is_active, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        gln:
          type: string
          pattern: "^[0-9]{13}$"
        name:
          type: string
          minLength: 1
          maxLength: 255
        address:
          type: string
          minLength: 1
          maxLength: 500
        city:
          type: string
          minLength: 1
          maxLength: 100
        country_code:
          type: string
          description: ISO 3166-1 alpha-2 code.
          pattern: "^[A-Z]{2}$"
        latitude:
          type: number
          description: WGS-84 degrees, 6 decimals.
          minimum: -90
          maximum: 90
        longitude:
          type: number
          description: WGS-84 degrees, 6 decimals.
          minimum: -180
          maximum: 180
        geo_fence_radius_meters:
          type: integer
          minimum: 50
          maximum: 5000
        is_headquarters:
          type: boolean
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    LocationCreateRequest:
      type: object
      additionalProperties: false
      required: [gln, name, address, city, latitude, longitude]
      properties:
        gln:
          type: string
          description: Must start with the tenant's GS1 company prefix and end with a valid check digit.
          pattern: "^[0-9]{13}$"
        name:
          type: string
          minLength: 1
          maxLength: 255
        address:
          type: string
          minLength: 1
          maxLength: 500
        city:
          type: string
          minLength: 1
          maxLength: 100
        country_code:
          type: string
          pattern: "^[A-Z]{2}$"
          default: VN
        latitude:
          type: number
          description: Rounded to 6 decimals.
          minimum: -90
          maximum: 90
        longitude:
          type: number
          description: Rounded to 6 decimals.
          minimum: -180
          maximum: 180
        geo_fence_radius_meters:
          type: integer
          minimum: 50
          maximum: 5000
          default: 200
    LocationPatch:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        address:
          type: string
          minLength: 1
          maxLength: 500
        city:
          type: string
          minLength: 1
          maxLength: 100
        country_code:
          type: string
          pattern: "^[A-Z]{2}$"
        latitude:
          type: number
          description: Rounded to 6 decimals.
          minimum: -90
          maximum: 90
        longitude:
          type: number
          description: Rounded to 6 decimals.
          minimum: -180
          maximum: 180
        geo_fence_radius_meters:
          type: integer
          minimum: 50
          maximum: 5000
        is_active:
          type: boolean
          description: Inactive locations cannot receive new lots or shipments and are not in the directory.
    LocationPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Location"
        next_cursor:
          type: [string, "null"]
          description: Pass as `cursor` to read the next page; `null` on the last page.
    Temperature:
      type: number
      description: Degrees Celsius, at most 2 decimals.
      minimum: -50
      maximum: 80
    Product:
      type: object
      description: A trade item of the caller's tenant, identified by its GTIN-14.
      required: [id, gtin, name, description, min_temp_celsius, max_temp_celsius, is_active, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        gtin:
          type: string
          description: GTIN-14. GTIN-8, -12, and -13 are left-padded with zeros.
          pattern: "^[0-9]{14}$"
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: [string, "null"]
          minLength: 1
          maxLength: 1000
        min_temp_celsius:
          $ref: "#/components/schemas/Temperature"
        max_temp_celsius:
          $ref: "#/components/schemas/Temperature"
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProductCreateRequest:
      type: object
      additionalProperties: false
      required: [gtin, name, min_temp_celsius, max_temp_celsius]
      properties:
        gtin:
          type: string
          description: |
            GTIN-14 with the tenant's company prefix after the indicator digit and a valid check digit. Clients
            left-pad GTIN-8, -12, and -13 with zeros.
          pattern: "^[0-9]{14}$"
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: [string, "null"]
          description: "`null` or an empty string means no description."
          maxLength: 1000
        min_temp_celsius:
          $ref: "#/components/schemas/Temperature"
        max_temp_celsius:
          description: Must be higher than `min_temp_celsius`.
          allOf:
            - $ref: "#/components/schemas/Temperature"
    ProductPatch:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: [string, "null"]
          description: "`null` or an empty string clears it."
          maxLength: 1000
        min_temp_celsius:
          $ref: "#/components/schemas/Temperature"
        max_temp_celsius:
          $ref: "#/components/schemas/Temperature"
        is_active:
          type: boolean
    ProductPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        next_cursor:
          type: [string, "null"]
          description: Pass as `cursor` to read the next page; `null` on the last page.
    LotStatus:
      type: string
      description: A `RECALLED` lot takes no new shipments, and its shipments accept no further commands.
      enum: [ACTIVE, RECALLED]
    LotNumber:
      type: string
      description: GS1 AI 10, restricted to characters that need no escaping in URLs.
      pattern: "^[0-9A-Za-z._-]{1,20}$"
    Lot:
      type: object
      description: |
        A production batch of one product. The GTIN, product name, and temperature bounds are copied from the
        product at commissioning, so tenants that hold the lot read them without the owner's catalog.
      required:
        - id
        - owner_tenant_id
        - product_id
        - gtin
        - product_name
        - min_temp_celsius
        - max_temp_celsius
        - lot_number
        - production_date
        - expiration_date
        - quantity_commissioned
        - commissioned_location_id
        - status
        - recalled_at
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        owner_tenant_id:
          type: string
          format: uuid
          description: The tenant that commissioned the lot. Compare with the caller's tenant to tell owned lots from held ones.
        product_id:
          type: string
          format: uuid
          description: A product of the owner.
        gtin:
          type: string
          pattern: "^[0-9]{14}$"
        product_name:
          type: string
        min_temp_celsius:
          $ref: "#/components/schemas/Temperature"
        max_temp_celsius:
          $ref: "#/components/schemas/Temperature"
        lot_number:
          $ref: "#/components/schemas/LotNumber"
        production_date:
          type: string
          format: date
        expiration_date:
          type: string
          format: date
        quantity_commissioned:
          type: integer
          minimum: 1
        commissioned_location_id:
          type: string
          format: uuid
          description: A location of the owner.
        status:
          $ref: "#/components/schemas/LotStatus"
        recalled_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    LotCommissionRequest:
      type: object
      additionalProperties: false
      required: [product_id, lot_number, production_date, expiration_date, quantity_commissioned, commissioned_location_id]
      properties:
        product_id:
          type: string
          format: uuid
          description: An active product of the caller's tenant.
        lot_number:
          $ref: "#/components/schemas/LotNumber"
        production_date:
          type: string
          format: date
        expiration_date:
          type: string
          format: date
          description: Not earlier than `production_date`.
        quantity_commissioned:
          type: integer
          minimum: 1
          maximum: 2147483647
        commissioned_location_id:
          type: string
          format: uuid
          description: An active location of the caller's tenant, where the goods were produced or stored.
    LotPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Lot"
        next_cursor:
          type: [string, "null"]
          description: Pass as `cursor` to read the next page; `null` on the last page.
    Balance:
      type: object
      description: The stock of one lot at one location of the caller's tenant.
      required: [location, lot, quantity_on_hand, updated_at]
      properties:
        location:
          type: object
          required: [id, gln, name]
          properties:
            id:
              type: string
              format: uuid
            gln:
              type: string
              pattern: "^[0-9]{13}$"
            name:
              type: string
        lot:
          type: object
          required: [id, lot_number, gtin, product_name, expiration_date, status]
          properties:
            id:
              type: string
              format: uuid
            lot_number:
              $ref: "#/components/schemas/LotNumber"
            gtin:
              type: string
              pattern: "^[0-9]{14}$"
            product_name:
              type: string
            expiration_date:
              type: string
              format: date
            status:
              $ref: "#/components/schemas/LotStatus"
        quantity_on_hand:
          type: integer
          minimum: 1
        updated_at:
          type: string
          format: date-time
    BalancePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Balance"
        next_cursor:
          type: [string, "null"]
          description: Pass as `cursor` to read the next page; `null` on the last page.
    CheckpointRecord:
      type: object
      additionalProperties: false
      required: [sscc, gln, position]
      properties:
        sscc:
          type: string
          description: The SSCC scanned from the pallet label.
          pattern: "^[0-9]{18}$"
        gln:
          type: string
          description: The facility, scanned or typed; the directory resolves it.
          pattern: "^[0-9]{13}$"
        position:
          $ref: "#/components/schemas/Position"
    DeliveryConfirmation:
      type: object
      additionalProperties: false
      required: [sscc, position]
      properties:
        sscc:
          type: string
          description: The SSCC scanned from the pallet label.
          pattern: "^[0-9]{18}$"
        position:
          $ref: "#/components/schemas/Position"
    ShipmentStatus:
      type: string
      description: See docs/domain/shipment-lifecycle.md §3.
      enum: [CREATED, IN_TRANSIT, DELIVERED, CANCELLED, RECALLED]
    ParticipantRole:
      type: string
      description: A tenant's part in a shipment. `INSPECTOR` arrives in M2.
      enum: [OWNER, CARRIER, CONSIGNEE, INSPECTOR]
    Participant:
      type: object
      description: A tenant involved in the shipment, with its directory fields as they were when it joined.
      required: [tenant_id, role, tenant_code, legal_name]
      properties:
        tenant_id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/ParticipantRole"
        tenant_code:
          type: string
        legal_name:
          type: string
    Facility:
      type: object
      description: The origin or destination as it was when the shipment was created.
      required: [location_id, gln, name, latitude, longitude, geo_fence_radius_meters]
      properties:
        location_id:
          type: string
          format: uuid
        gln:
          type: string
          pattern: "^[0-9]{13}$"
        name:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        geo_fence_radius_meters:
          type: integer
    Shipment:
      type: object
      description: |
        A quantity of one lot moving as one logistic unit, identified by its SSCC. The product, lot, origin, and
        destination fields are snapshots taken when the shipment was created.
      required:
        - id
        - sscc
        - status
        - quantity
        - lot
        - product
        - origin
        - destination
        - owner_tenant_id
        - carrier_tenant_id
        - consignee_tenant_id
        - assigned_driver_id
        - participants
        - picked_up_at
        - delivered_at
        - cancelled_at
        - recalled_at
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        sscc:
          type: string
          pattern: "^[0-9]{18}$"
        status:
          $ref: "#/components/schemas/ShipmentStatus"
        quantity:
          type: integer
          minimum: 1
        lot:
          type: object
          required: [id, lot_number, expiration_date]
          properties:
            id:
              type: string
              format: uuid
            lot_number:
              $ref: "#/components/schemas/LotNumber"
            expiration_date:
              type: string
              format: date
        product:
          type: object
          required: [gtin, name, min_temp_celsius, max_temp_celsius]
          properties:
            gtin:
              type: string
              pattern: "^[0-9]{14}$"
            name:
              type: string
            min_temp_celsius:
              $ref: "#/components/schemas/Temperature"
            max_temp_celsius:
              $ref: "#/components/schemas/Temperature"
        origin:
          $ref: "#/components/schemas/Facility"
        destination:
          $ref: "#/components/schemas/Facility"
        owner_tenant_id:
          type: string
          format: uuid
        carrier_tenant_id:
          type: string
          format: uuid
        consignee_tenant_id:
          type: string
          format: uuid
        assigned_driver_id:
          type: [string, "null"]
          format: uuid
          description: A user of the carrier.
        participants:
          type: array
          items:
            $ref: "#/components/schemas/Participant"
        picked_up_at:
          type: [string, "null"]
          format: date-time
        delivered_at:
          type: [string, "null"]
          format: date-time
        cancelled_at:
          type: [string, "null"]
          format: date-time
        recalled_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ShipmentPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Shipment"
        next_cursor:
          type: [string, "null"]
          description: Pass as `cursor` to read the next page; `null` on the last page.
    ShipmentCreateRequest:
      type: object
      additionalProperties: false
      required: [lot_id, quantity, origin_location_id, destination_gln]
      properties:
        lot_id:
          type: string
          format: uuid
          description: A lot that the caller's tenant owns or holds.
        quantity:
          type: integer
          minimum: 1
          maximum: 2147483647
        origin_location_id:
          type: string
          format: uuid
          description: An active location of the caller's tenant that holds at least the quantity of the lot.
        destination_gln:
          type: string
          pattern: "^[0-9]{13}$"
          description: An active location of any tenant, as the directory lists it; not the origin.
        carrier_tenant_code:
          type: [string, "null"]
          description: The carrier's tenant code, matched ignoring case. Omitted, the owner carries the goods itself.
        driver_user_id:
          type: [string, "null"]
          format: uuid
          description: One of the owner's active drivers, when the owner carries the goods itself.
    CarrierAssignment:
      type: object
      additionalProperties: false
      required: [carrier_tenant_code]
      properties:
        carrier_tenant_code:
          type: string
          description: Another tenant's code, matched ignoring case.
    DriverAssignment:
      type: object
      additionalProperties: false
      required: [driver_user_id]
      properties:
        driver_user_id:
          type: string
          format: uuid
    Cancellation:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    ShipmentSummary:
      type: object
      required: [created, in_transit, delivered, cancelled, recalled]
      properties:
        created:
          type: integer
        in_transit:
          type: integer
        delivered:
          type: integer
        cancelled:
          type: integer
        recalled:
          type: integer
    ShipmentEvent:
      type: object
      description: |
        One entry of a shipment's log. `event_hash` is the SHA-256, in lowercase hex, of the RFC 8785 canonical
        JSON of every other member; `prev_event_hash` is the hash of the event before, or 64 zeros.
      required: [event_id, event_type, event_version, occurred_at, subject, actor, sequence, prev_event_hash, event_hash, data]
      properties:
        event_id:
          type: string
          format: uuid
        event_type:
          type: string
          example: shipment.driver_assigned
        event_version:
          type: integer
        occurred_at:
          type: string
          format: date-time
          description: UTC with exactly six fractional digits, as hashed.
          example: "2026-10-02T08:05:30.250000Z"
        subject:
          type: object
          required: [shipment_id, sscc, status]
          properties:
            shipment_id:
              type: string
              format: uuid
            sscc:
              type: string
            status:
              $ref: "#/components/schemas/ShipmentStatus"
        actor:
          type: [object, "null"]
          required: [tenant_id, user_id]
          properties:
            tenant_id:
              type: string
              format: uuid
            user_id:
              type: string
              format: uuid
        sequence:
          type: integer
          minimum: 1
        prev_event_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
        event_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
        data:
          type: object
          description: The payload of the event type (docs/contracts/messaging.md §3).
    ShipmentEventPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ShipmentEvent"
        next_cursor:
          type: [string, "null"]
          description: Pass as `cursor` to read the next page; `null` on the last page.
    Integrity:
      type: object
      required: [valid, event_count, head_hash, first_invalid_sequence]
      properties:
        valid:
          type: boolean
        event_count:
          type: integer
        head_hash:
          type: [string, "null"]
          description: The stored hash of the last event.
        first_invalid_sequence:
          type: [integer, "null"]
          description: The first position where the chain breaks; `null` when it is valid.
    DirectoryTenant:
      type: object
      description: The public entry of an active tenant.
      required: [id, code, legal_name]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          pattern: "^[A-Z0-9_]{3,32}$"
        legal_name:
          type: string
    DirectoryLocation:
      type: object
      description: The public entry of an active location of an active tenant.
      required: [gln, name, address, city, country_code, latitude, longitude, geo_fence_radius_meters, tenant]
      properties:
        gln:
          type: string
          pattern: "^[0-9]{13}$"
        name:
          type: string
        address:
          type: string
        city:
          type: string
        country_code:
          type: string
          pattern: "^[A-Z]{2}$"
        latitude:
          type: number
          description: WGS-84 degrees, 6 decimals.
        longitude:
          type: number
          description: WGS-84 degrees, 6 decimals.
        geo_fence_radius_meters:
          type: integer
          description: Positions within this distance of the coordinates count as at the location.
        tenant:
          $ref: "#/components/schemas/DirectoryTenant"
    Role:
      type: string
      description: The user's role within its tenant. `INSPECTOR` gains permissions in M2.
      enum: [ADMIN, WAREHOUSE_MANAGER, DRIVER, INSPECTOR]
    User:
      type: object
      description: A user of the caller's tenant.
      required: [id, email, full_name, phone, role, is_active, last_login_at, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          maxLength: 254
        full_name:
          type: string
          minLength: 1
          maxLength: 255
        phone:
          type: [string, "null"]
          minLength: 6
          maxLength: 32
        role:
          $ref: "#/components/schemas/Role"
        is_active:
          type: boolean
          description: Inactive users cannot sign in or refresh their session.
        last_login_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Password:
      type: string
      description: 12 to 128 characters; any characters are allowed and nothing is trimmed.
      format: password
      minLength: 12
      maxLength: 128
    Phone:
      type: [string, "null"]
      description: Digits, spaces, and `+ ( ) . -`, 6 to 32 characters. `null` or an empty string clears it.
      pattern: "^\\+?[0-9(][0-9 ().-]*[0-9]$"
      minLength: 6
      maxLength: 32
    TenantSummary:
      type: object
      description: The tenant of the signed-in user.
      required: [id, code, legal_name, gs1_company_prefix, status]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        legal_name:
          type: string
        gs1_company_prefix:
          type: string
          description: Every GLN and GTIN the tenant registers starts with it; forms validate against it.
        status:
          type: string
          enum: [ACTIVE, SUSPENDED]
    Me:
      description: The signed-in user and its tenant.
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [tenant]
          properties:
            tenant:
              $ref: "#/components/schemas/TenantSummary"
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          maxLength: 254
        password:
          type: string
          format: password
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          $ref: "#/components/schemas/Password"
    Session:
      type: object
      description: A new access token, the refresh token that replaces the presented one, and the user.
      required: [access_token, token_type, expires_in, refresh_token, refresh_token_expires_in, user]
      properties:
        access_token:
          type: string
          description: EdDSA-signed JWT with the claims `sub`, `tid`, `role`, `iat`, `exp`, and `jti`.
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Seconds until the access token expires (900).
        refresh_token:
          type: string
          description: Opaque, single-use token. Keep it out of scripts (ADR-0021).
        refresh_token_expires_in:
          type: integer
          description: Seconds until the refresh token expires; each refresh starts a new period.
        user:
          $ref: "#/components/schemas/Me"
    JWK:
      type: object
      required: [kty, crv, kid, x, alg, use]
      properties:
        kty:
          type: string
          enum: [OKP]
        crv:
          type: string
          enum: [Ed25519]
        kid:
          type: string
        x:
          type: string
          description: The public key, base64url without padding.
        alg:
          type: string
          enum: [EdDSA]
        use:
          type: string
          enum: [sig]
    JWKS:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/JWK"
    TenantPatch:
      type: object
      additionalProperties: false
      properties:
        legal_name:
          type: string
          minLength: 1
          maxLength: 255
        sscc_extension_digit:
          type: integer
          minimum: 0
          maximum: 9
    UserCreateRequest:
      type: object
      additionalProperties: false
      required: [email, password, full_name, role]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          $ref: "#/components/schemas/Password"
        full_name:
          type: string
          minLength: 1
          maxLength: 255
        phone:
          $ref: "#/components/schemas/Phone"
        role:
          $ref: "#/components/schemas/Role"
    UserPatch:
      type: object
      additionalProperties: false
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 255
        phone:
          $ref: "#/components/schemas/Phone"
        role:
          $ref: "#/components/schemas/Role"
        is_active:
          type: boolean
    UserPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        next_cursor:
          type: [string, "null"]
          description: Pass as `cursor` to read the next page; `null` on the last page.
    TenantRegistrationRequest:
      type: object
      additionalProperties: false
      required: [tenant, headquarters, admin]
      properties:
        tenant:
          type: object
          additionalProperties: false
          required: [code, legal_name, tax_code, gs1_company_prefix]
          properties:
            code:
              type: string
              pattern: "^[A-Z0-9_]{3,32}$"
            legal_name:
              type: string
              minLength: 1
              maxLength: 255
            tax_code:
              type: string
              pattern: "^[0-9]{10}(-[0-9]{3})?$"
            gs1_company_prefix:
              type: string
              pattern: "^[0-9]{6,10}$"
        headquarters:
          $ref: "#/components/schemas/LocationCreateRequest"
        admin:
          type: object
          additionalProperties: false
          required: [email, password, full_name]
          properties:
            email:
              type: string
              format: email
              maxLength: 254
            password:
              $ref: "#/components/schemas/Password"
            full_name:
              type: string
              minLength: 1
              maxLength: 255
            phone:
              $ref: "#/components/schemas/Phone"
    TenantRegistration:
      type: object
      required: [tenant, headquarters, admin]
      properties:
        tenant:
          $ref: "#/components/schemas/Tenant"
        headquarters:
          $ref: "#/components/schemas/Location"
        admin:
          $ref: "#/components/schemas/User"
    Position:
      type: object
      description: |
        Device-reported WGS-84 position. Coordinates are rounded to 6 decimals and the accuracy to 1. A position
        counts as at a facility within the geo-fence radius plus the accuracy, of which at most 50 m count.
      required: [latitude, longitude, accuracy_meters]
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        accuracy_meters:
          type: number
          minimum: 0
          maximum: 100000
    PickupCode:
      type: object
      required: [code, expires_at, attempts_allowed]
      properties:
        code:
          type: string
          pattern: "^[0-9]{6}$"
        expires_at:
          type: string
          format: date-time
        attempts_allowed:
          type: integer
    PickupConfirmation:
      type: object
      additionalProperties: false
      required: [sscc, code, position]
      properties:
        sscc:
          type: string
          description: The SSCC scanned from the pallet label.
          pattern: "^[0-9]{18}$"
        code:
          type: string
          pattern: "^[0-9]{6}$"
        position:
          $ref: "#/components/schemas/Position"
  responses:
    UpdatedShipment:
      description: The shipment after the command.
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/TraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Shipment"
    Session:
      description: Signed in. The response must not be cached.
      headers:
        Cache-Control:
          schema:
            type: string
            example: no-store
        X-Trace-Id:
          $ref: "#/components/headers/TraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Session"
          example:
            access_token: eyJhbGciOiJFZERTQSIsImtpZCI6IjIwMjYtMDkiLCJ0eXAiOiJKV1QifQ.eyJ0aWQiOiIwMTkyZjdhNC03YzNlLTdkMmEtOWIxZS0zZjRhNWI2YzdkOGUiLCJyb2xlIjoiQURNSU4iLCJzdWIiOiIwMTkyZjdhNC03YzNlLTdkMmEtOWIxZS0zZjRhNWI2YzdkOTAiLCJleHAiOjE3OTEwMjM1MDAsImlhdCI6MTc5MTAyMjYwMCwianRpIjoiMDE5MmY3YTQtN2MzZS03ZDJhLTliMWUtM2Y0YTViNmM3ZDkxIn0.signature
            token_type: Bearer
            expires_in: 900
            refresh_token: 3Q2y9m0bq6Yx1S8QkqUe0Z0f2nY7fQyGmW3p5d4Jt0A
            refresh_token_expires_in: 604800
            user:
              id: 0192f7a4-7c3e-7d2a-9b1e-3f4a5b6c7d90
              email: admin@sgfresh.example
              full_name: Nguyen Van An
              phone: "+84 28 3822 1234"
              role: ADMIN
              is_active: true
              last_login_at: "2026-09-30T08:10:00.123456Z"
              created_at: "2026-09-30T08:00:00.123456Z"
              updated_at: "2026-09-30T08:10:00.123456Z"
              tenant:
                id: 0192f7a4-7c3e-7d2a-9b1e-3f4a5b6c7d8e
                code: SGFRESH
                legal_name: Saigon Fresh Foods Joint Stock Company
                gs1_company_prefix: "8930001"
                status: ACTIVE
    BadRequest:
      description: The request is malformed or fails validation.
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/TraceId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: |
        Missing, invalid, or expired credentials: `UNAUTHENTICATED`, `TOKEN_EXPIRED` (refresh and retry once),
        `INVALID_CREDENTIALS`, or `REFRESH_TOKEN_INVALID`.
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/TraceId"
        WWW-Authenticate:
          description: Bearer challenge (RFC 6750) on requests without a valid access token.
          schema:
            type: string
            example: Bearer realm="veritrace", error="invalid_token", error_description="expired"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The caller may see the resource but may not perform the action.
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/TraceId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The resource does not exist or is not visible to the caller.
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/TraceId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The request conflicts with the current state.
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/TraceId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableContent:
      description: The request is well-formed but violates a domain rule.
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/TraceId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Locked:
      description: "`PICKUP_CODE_LOCKED`: the pickup code has no attempts left; the owner must issue a new one."
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/TraceId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLarge:
      description: The request body exceeds 1 MiB.
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/TraceId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: The request body is not `application/json`.
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/TraceId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/TraceId"
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: Unexpected failure; details are in the service logs under the trace ID.
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/TraceId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
