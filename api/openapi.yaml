  /api/v1/shipments/{shipment_id}:
    parameters:
      - $ref: "#/components/parameters/ShipmentID"
    get:
      operationId: getShipment
      tags: [Shipments]
      summary: Read a shipment
      description: |
        Any participant. A `DRIVER` of the carrier reads only the shipments assigned to it (403 otherwise); other
        tenants get 404.
      responses:
        "200":
          description: The shipment.
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shipment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/shipments/{shipment_id}/carrier:
    parameters:
      - $ref: "#/components/parameters/ShipmentID"
    post:
      operationId: assignCarrier
      tags: [Shipments]
      summary: Assign a carrier
      description: |
        `ADMIN` and `WAREHOUSE_MANAGER` of the owner, while the shipment is `CREATED` and the owner still carries it
        itself; otherwise `409 INVALID_STATE_TRANSITION`. The carrier replaces the owner as `CARRIER`, the owner's
        driver is released, and `shipment.participant_added` is appended.
      requestBody:
        required: true
