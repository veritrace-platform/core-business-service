    post:
      operationId: assignDriver
      tags: [Shipments]
      summary: Assign or replace the driver
      description: |
        `ADMIN` and `WAREHOUSE_MANAGER` of the carrier, while the shipment is `CREATED`. The driver must be an active
        `DRIVER` of the carrier. Appends `shipment.driver_assigned`; assigning the driver already assigned changes
        nothing.
      requestBody:
