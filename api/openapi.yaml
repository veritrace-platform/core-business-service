          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/shipments/{shipment_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/ShipmentID"
    post:
      operationId: cancelShipment
      tags: [Shipments]
      summary: Cancel a shipment
      description: |
        `ADMIN` and `WAREHOUSE_MANAGER` of the owner, while the shipment is `CREATED`. The quantity returns to the
        origin balance, the SSCC is never reused, and `shipment.cancelled` records the reason.
      requestBody:
        required: true
