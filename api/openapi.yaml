  /api/v1/shipments:
    get:
      operationId: listShipments
      tags: [Shipments]
      summary: List shipments
      description: |
        Newest first: the shipments in which the caller's tenant takes part. A `DRIVER` sees only the shipments assigned
        to it, whatever the filters say.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ShipmentStatus"
        - name: party
          in: query
          description: Keeps the shipments in which the caller's tenant has this role.
          schema:
            $ref: "#/components/schemas/ParticipantRole"
        - name: sscc
          in: query
          description: A scanned SSCC; a malformed one answers `422 INVALID_GS1_IDENTIFIER`.
          schema:
            type: string
            pattern: "^[0-9]{18}$"
        - name: lot_id
          in: query
          schema:
            type: string
            format: uuid
        - name: assigned_to_me
          in: query
          description: Keeps the shipments assigned to the caller as driver.
          schema:
            type: boolean
      responses:
        "200":
          description: A page of shipments.
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShipmentPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createShipment
      tags: [Shipments]
      summary: Create a shipment
      description: |
        `ADMIN` and `WAREHOUSE_MANAGER` of a tenant that holds the lot. In one transaction the service issues the
        SSCC, copies the product, lot, origin, and destination fields onto the shipment, records the participants
        (`OWNER` the caller's tenant, `CARRIER` the carrier or the owner itself, `CONSIGNEE` the tenant of the
        destination GLN), takes the quantity from the origin balance, and appends `shipment.created`.

        The lot, origin, destination, carrier, and driver must be usable: a lot the tenant does not hold, an origin
        that is not one of its active locations, a destination GLN that the directory does not list or that equals
        the origin, an unknown carrier code, or a driver who is not an active driver of the tenant answers `400`
        with `INVALID_VALUE` on that field. A driver can be set only when the owner carries the goods itself. A
        recalled lot answers `409 LOT_RECALLED`, an origin balance below the quantity `409 INSUFFICIENT_STOCK`, and
        an exhausted serial space `409 SSCC_SERIAL_EXHAUSTED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShipmentCreateRequest"
            example:
              lot_id: 0192f7a4-7c3e-7d2a-9b1e-3f4a5b6c7d95
              quantity: 480
              origin_location_id: 0192f7a4-7c3e-7d2a-9b1e-3f4a5b6c7d92
              destination_gln: "8934567000017"
              carrier_tenant_code: MEKONG_LOGISTICS
      responses:
        "201":
          description: The shipment is created. `Location` points to it.
          headers:
            Location:
              schema:
                type: string
                example: /api/v1/shipments/0192f7a4-7c3e-7d2a-9b1e-3f4a5b6c7da0
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shipment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "500":
          $ref: "#/components/responses/InternalError"
