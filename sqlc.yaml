# sqlc generates typed Go from the SQL next to each domain package (ADR-0004).
# Regenerate with `make generate`; CI fails when the generated code is out of date.
version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/tenant/queries
    gen:
      go: &go
        package: queries
        out: internal/tenant/queries
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        omit_unused_structs: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          # Numeric values (coordinates, temperatures) have at most 9 digits, which a float64 round-trips, and
          # pgx converts them through their decimal text. Function results name the type without its schema.
          - db_type: numeric
            go_type: float64
          - db_type: numeric
            nullable: true
            go_type:
              type: float64
              pointer: true
          - db_type: pg_catalog.numeric
            go_type: float64
          - db_type: pg_catalog.numeric
            nullable: true
            go_type:
              type: float64
              pointer: true
          - db_type: date
            go_type: github.com/veritrace-platform/core-business-service/internal/calendar.Date
          - db_type: date
            nullable: true
            go_type:
              import: github.com/veritrace-platform/core-business-service/internal/calendar
              type: Date
              pointer: true
  - engine: postgresql
    schema: migrations
    queries: internal/auth/queries
    gen:
      go:
        <<: *go
        out: internal/auth/queries
  - engine: postgresql
    schema: migrations
    queries: internal/user/queries
    gen:
      go:
        <<: *go
        out: internal/user/queries
  - engine: postgresql
    schema: migrations
    queries: internal/location/queries
    gen:
      go:
        <<: *go
        out: internal/location/queries
  - engine: postgresql
    schema: migrations
    queries: internal/product/queries
    gen:
      go:
        <<: *go
        out: internal/product/queries
  - engine: postgresql
    schema: migrations
    queries: internal/lot/queries
    gen:
      go:
        <<: *go
        out: internal/lot/queries
  - engine: postgresql
    schema: migrations
    queries: internal/inventory/queries
    gen:
      go:
        <<: *go
        out: internal/inventory/queries
  - engine: postgresql
    schema: migrations
    queries: internal/event/queries
    gen:
      go:
        <<: *go
        out: internal/event/queries
  - engine: postgresql
    schema: migrations
    queries: internal/outbox/queries
    gen:
      go:
        <<: *go
        out: internal/outbox/queries
  - engine: postgresql
    schema: migrations
    queries: internal/directory/queries
    gen:
      go:
        <<: *go
        out: internal/directory/queries
